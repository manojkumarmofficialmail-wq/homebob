<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homzy</title>
  <meta name="description" content="Homzy: scan bills, speak your shopping list, track kitchen stock, plan meals and share chores. Saved on your phone.">
  <meta name="theme-color" content="#1f6f50" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homzy">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-text">
      <p class="hello" id="hello"></p>
      <h1 id="title">Homzy</h1>
    </div>
    <button class="pill" id="install" hidden>Install app</button>
    <button class="icon-btn" data-action="settings" aria-label="Settings">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg>
    </button>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted center">Loading…</p>
  </main>

  <div class="actions">
    <button class="act scan" data-action="scan">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>
      Scan bill
    </button>
    <button class="act speak" data-action="speak">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Speak
    </button>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-action="tab" data-tab="home">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home
    </button>
    <button data-action="tab" data-tab="list">
      <span class="badge-wrap">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/></svg>
        <span class="badge" id="list-badge" hidden></span>
      </span>List
    </button>
    <button data-action="tab" data-tab="kitchen">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v4H7z"/><path d="M5 7h14v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 12h6"/></svg>Kitchen
    </button>
    <button data-action="tab" data-tab="plan">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan
    </button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast" role="status" hidden></div>

  <input type="file" id="photo" accept="image/*" hidden>
  <input type="file" id="restore" accept="application/json,.json" hidden>
  <datalist id="catalog"></datalist>

  <noscript>Homzy needs JavaScript turned on.</noscript>
</body>
</html>

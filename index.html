<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homzy</title>
  <meta name="description" content="Homzy: plan meals, share one shopping list and split the work at home. See the family's weekly nutrition and food spend.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101814" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homzy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" aria-live="polite">
    <p class="note plain center">Getting your home ready…</p>
  </main>

  <div class="actions">
    <button class="act scan" data-action="scan">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>
      Scan bill
    </button>
    <button class="act speak" data-action="speak">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Speak
    </button>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-action="tab" data-tab="home">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Home
    </button>
    <button data-action="tab" data-tab="plan">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Plan
    </button>
    <button data-action="tab" data-tab="list">
      <span class="badge-wrap">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span class="badge" id="list-badge" hidden></span>
      </span>List
    </button>
    <button data-action="tab" data-tab="week">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><rect x="6" y="11" width="3" height="6" rx="1"/><rect x="11" y="6" width="3" height="11" rx="1"/><rect x="16" y="13" width="3" height="4" rx="1"/></svg>Week
    </button>
    <button data-action="tab" data-tab="family">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.6c.6-.2 1.3-.3 2-.3 2.8 0 4.5 2.2 4.5 5"/></svg>Family
    </button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast" role="status" hidden></div>

  <input type="file" id="photo" accept="image/*" hidden>
  <input type="file" id="qr-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="restore" accept="application/json,.json" hidden>
  <datalist id="catalog"></datalist>

  <noscript>Homzy needs JavaScript turned on.</noscript>
</body>
</html>

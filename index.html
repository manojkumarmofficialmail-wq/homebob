<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homzy</title>
  <meta name="description" content="Homzy: plan meals, share one shopping list and split the work at home. See the family's weekly nutrition and food spend.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homzy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/homzy-motion.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <main id="view" tabindex="-1">
    <p class="note plain center">Getting your home ready…</p>
  </main>

  <nav class="tabs" aria-label="Main">
    <button data-action="tab" data-tab="home">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>Home
    </button>
    <button data-action="tab" data-tab="plan">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>Plan
    </button>
    <button class="kitchen-tab" data-action="tab" data-tab="kitchen" aria-label="Kitchen: speak, add dishes, stock">
      <span class="fab" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M2 11h20M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg></span>Kitchen
    </button>
    <button data-action="tab" data-tab="list">
      <span class="tab-ico">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        <span class="badge" id="list-badge" hidden></span>
      </span>List
    </button>
    <button data-action="tab" data-tab="money">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span>Money
    </button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="taps" aria-hidden="true"></div>

  <input type="file" id="photo" accept="image/*" hidden>
  <input type="file" id="qr-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="restore" accept="application/json,.json" hidden>

  <noscript>Homzy needs JavaScript turned on.</noscript>
</body>
</html>

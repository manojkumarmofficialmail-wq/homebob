<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homzy</title>
  <meta name="description" content="Homzy: plan meals, share one shopping list and split the work at home. See the family's weekly nutrition and food spend.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homzy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <main id="view" tabindex="-1">
    <p class="note plain center">Getting your home ready…</p>
  </main>

  <nav class="tabs" aria-label="Main">
    <button data-action="tab" data-tab="home">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg></span>Home
    </button>
    <button data-action="tab" data-tab="plan">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>Plan
    </button>
    <button class="kitchen-tab" data-action="tab" data-tab="kitchen" aria-label="Kitchen: speak, add dishes, stock">
      <span class="fab" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 6.5c0-1.5 1.5-1.5 1.5-3M13.5 6.5c0-1.5 1.5-1.5 1.5-3"/></svg></span>Kitchen
    </button>
    <button data-action="tab" data-tab="list">
      <span class="tab-ico">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span class="badge" id="list-badge" hidden></span>
      </span>List
    </button>
    <button data-action="tab" data-tab="money">
      <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><circle cx="16" cy="13.5" r="1.2"/></svg></span>Money
    </button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <input type="file" id="photo" accept="image/*" hidden>
  <input type="file" id="qr-photo" accept="image/*" capture="environment" hidden>
  <input type="file" id="restore" accept="application/json,.json" hidden>

  <noscript>Homzy needs JavaScript turned on.</noscript>
</body>
</html>
